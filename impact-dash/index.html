<style>
:root{
  --navy:#0e2745;--gold:#d8a23a;--gold-light:#ecc06a;--cream:#fbf7ef;--cream-200:#f3ecdd;
  --sage:#4f8a63;--coral:#c8553d;--ink:#1c2330;--muted:#5e6b7e;--border:rgba(14,39,69,0.10);
  --display:'Fraunces',Georgia,serif;--sans:'Outfit',ui-sans-serif,system-ui,sans-serif;
}
*{box-sizing:border-box;}
body{font-family:var(--sans);background:var(--cream);color:var(--ink);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;margin:0;}
.wrap{max-width:1120px;margin:0 auto;padding:0 1.25rem;}
h2{margin:8px 0 0;}
.site-head{background:linear-gradient(135deg,var(--navy),#123034);color:#fff;padding:26px 0 22px;}
.site-head .eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-light);}
.site-head h1{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.1;margin:8px 0 4px;color:#fff;}
.site-head p{margin:0;color:#cfdedc;font-size:15px;max-width:60ch;}
main{padding:26px 0 60px;}
.panel{background:#fff;border:1px solid var(--border);border-radius:16px;padding:22px;box-shadow:0 1px 2px rgba(0,0,0,.04);}
.section-eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--sage);}
.sub{color:var(--muted);font-size:14px;}
.ess-nav{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px;}
.ess-chip{border:1px solid var(--border);background:#fff;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;font-family:var(--sans);transition:all .12s;}
.ess-chip:hover{border-color:var(--gold);color:var(--navy);}
.ess-chip.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.ins-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
@media(max-width:640px){.ins-tiles{grid-template-columns:1fr;}}
.ins-tile{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;}
.ins-tile .v{font-size:26px;font-weight:700;color:var(--navy);font-family:var(--display);}
.ins-tile .l{font-size:12px;color:var(--muted);margin-top:2px;}
.mv-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:14px;}
@media(max-width:820px){.mv-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:480px){.mv-grid{grid-template-columns:1fr;}}
.mv-tile{background:#fff;border:1px solid var(--border);border-top:3px solid var(--muted);border-radius:12px;padding:14px;}
.mv-cap{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px;}
.mv-cap i{width:9px;height:9px;border-radius:2px;display:inline-block;flex:none;}
.mv-n{font-family:var(--display);font-weight:700;font-size:30px;color:var(--navy);line-height:1.1;margin-top:8px;}
.mv-d{font-size:12px;color:var(--muted);margin-top:4px;}
.mv-bar{display:flex;height:26px;border-radius:8px;overflow:hidden;margin-top:16px;}
.mv-bar>span{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;min-width:0;}
.imd-achhead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;}
.imd-bignum{flex:none;text-align:center;background:linear-gradient(135deg,var(--navy),#123034);color:#fff;border-radius:14px;padding:14px 22px;box-shadow:0 2px 10px rgba(14,39,69,.25);}
.imd-bignum-n{font-family:var(--display);font-weight:700;font-size:38px;line-height:1;color:var(--gold-light);}
.imd-bignum-l{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;margin-top:4px;color:#cfdedc;}
@media(max-width:520px){.imd-achhead{flex-direction:column;}.imd-bignum{align-self:flex-start;}}
.imd-cr-real{display:flex;gap:14px;align-items:flex-start;background:rgba(79,138,99,.10);border:1px solid rgba(79,138,99,.30);border-left:3px solid var(--sage);border-radius:14px;padding:14px 16px;margin-bottom:16px;}
.imd-cr-real b{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sage);flex:none;padding-top:2px;}
.imd-cr-real p{font-size:13px;color:var(--ink);line-height:1.55;margin:0;}
.imd-cr-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;}
.imd-cr-kpi{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:0 1px 2px rgba(0,0,0,.04);}
.imd-cr-kpi .l{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
.imd-cr-kpi .n{font-family:var(--display);font-weight:700;font-size:38px;line-height:1;color:var(--navy);}
.imd-cr-kpi .n.up{color:var(--coral);} .imd-cr-kpi .n.down{color:var(--sage);}
.imd-cr-kpi .s{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:9px;}
.imd-cr-launch{display:grid;grid-template-columns:1.5fr 1fr;gap:0;background:var(--navy);border-radius:16px;overflow:hidden;color:var(--cream);margin-bottom:16px;}
.imd-cr-lbody{padding:28px 30px;}
.imd-cr-lbody .eyebrow{color:var(--gold-light);}
.imd-cr-lbody h3{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.15;color:#fff;margin:10px 0 12px;}
.imd-cr-lbody p{font-size:14px;line-height:1.6;color:rgba(251,247,239,.72);margin:0;max-width:54ch;}
.imd-cr-btn{display:inline-flex;align-items:center;gap:9px;margin-top:20px;background:var(--gold);color:var(--navy);text-decoration:none;font-weight:700;font-size:14px;padding:11px 20px;border-radius:999px;font-family:var(--sans);}
.imd-cr-btn:hover{background:var(--gold-light);}
.imd-cr-lnote{display:block;margin-top:11px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:rgba(251,247,239,.5);}
.imd-cr-lside{background:rgba(0,0,0,.22);padding:28px 26px;display:flex;flex-direction:column;justify-content:center;}
.imd-cr-lrow{padding:10px 0;border-bottom:1px solid rgba(251,247,239,.12);}
.imd-cr-lrow:last-child{border-bottom:0;}
.imd-cr-lrow .k{display:block;font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:rgba(251,247,239,.5);margin-bottom:4px;}
.imd-cr-lrow .v{display:block;font-size:13px;color:rgba(251,247,239,.9);line-height:1.45;}
.imd-cr-bars{display:flex;flex-direction:column;gap:13px;margin-top:6px;}
.imd-cr-bar{display:grid;grid-template-columns:190px 1fr 92px;gap:14px;align-items:center;}
.imd-cr-bar .nm{font-size:13px;color:var(--ink);line-height:1.3;}
.imd-cr-bar .nm small{display:block;font-size:11px;color:var(--muted);}
.imd-cr-track{height:22px;background:var(--cream-200);border-radius:6px;position:relative;overflow:hidden;}
.imd-cr-fill{position:absolute;top:0;bottom:0;border-radius:6px;}
.imd-cr-zero{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--muted);opacity:.45;}
.imd-cr-bar .v{text-align:right;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;}
.imd-cr-bar .v.down{color:var(--sage);} .imd-cr-bar .v.up{color:var(--coral);}
@media (max-width:760px){.imd-cr-kpis{grid-template-columns:1fr;}.imd-cr-launch{grid-template-columns:1fr;}.imd-cr-lside{padding:6px 22px 22px;}.imd-cr-bar{grid-template-columns:120px 1fr 74px;}}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;}
.imd-hero{background:linear-gradient(135deg,var(--navy),#123034);color:#eaf1f0;border-radius:16px;padding:24px;display:grid;grid-template-columns:1.2fr 1fr;gap:22px;align-items:center;}
@media(max-width:640px){.imd-hero{grid-template-columns:1fr;}}
.imd-hero .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-light);}
.imd-hero h2{font-family:var(--display);font-size:26px;margin:8px 0 0;color:#fff;line-height:1.1;}
.imd-big{display:flex;align-items:baseline;gap:10px;margin-top:14px;}
.imd-big span{font-family:var(--display);font-size:40px;font-weight:700;color:var(--gold-light);}
.imd-big em{font-style:normal;font-size:13px;color:#b9cbc9;}
.imd-move{margin-top:6px;font-size:14px;color:#cfdedc;}
.imd-move b{color:#fff;}
.imd-field{display:grid;grid-template-columns:repeat(auto-fill,minmax(12px,1fr));gap:3px;}
.imd-sq{aspect-ratio:1;border-radius:2px;}
.imd-key{display:flex;gap:14px;margin-top:10px;font-size:11.5px;color:#cfdedc;flex-wrap:wrap;}
.imd-key i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle;}
.imd-erow{margin-top:12px;}
.imd-eh{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600;color:var(--navy);margin-bottom:5px;}
.imd-ebar{height:11px;border-radius:6px;background:var(--cream-200);position:relative;overflow:hidden;}
.imd-ebar{height:13px;}
.imd-ebar .eb-base{position:absolute;left:0;top:0;bottom:0;background:#B7C6C5;}
.imd-ebar .eb-chg{position:absolute;top:0;bottom:0;}
.imd-ebar .eb-chg.up{background:var(--sage);}
.imd-ebar .eb-chg.down{background:var(--coral);}
.imd-legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin:4px 0 4px;}
.imd-legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:middle;}
.imd-need{display:flex;align-items:center;gap:10px;margin-top:10px;}
.imd-need .nm{width:150px;font-size:13.5px;font-weight:600;color:var(--navy);flex:none;}
.imd-need .bar{flex:1;height:9px;border-radius:5px;background:var(--cream-200);overflow:hidden;}
.imd-need .bar>span{display:block;height:100%;background:var(--coral);}
.imd-need .pct{width:44px;text-align:right;font-size:13px;font-weight:700;color:var(--coral);flex:none;}
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:14px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04);margin-top:10px;}
.tbl{border-collapse:collapse;width:100%;}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:11px 12px;border-bottom:1px solid var(--border);background:var(--cream);}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--border);color:var(--navy);vertical-align:middle;white-space:nowrap;}
.tbl .nm{font-weight:600;}
.story-q{font-family:var(--display);font-size:17px;color:var(--navy);line-height:1.35;font-style:italic;}
.pub-note{font-size:12px;color:var(--muted);margin-top:18px;text-align:center;}
.pub-zip{display:flex;justify-content:flex-end;margin-bottom:12px;}
.pub-zip label{font-size:13px;font-weight:600;color:var(--navy);display:flex;align-items:center;gap:7px;}
.pub-zip select{font-family:var(--sans);font-size:13px;padding:6px 9px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--navy);font-weight:600;}
</style>
</head>

function imdDemand(M){if(!M.topGoals||!M.topGoals.length)return '<div class="panel"><span class="section-eyebrow">Demand signals</span><h2>What members want</h2><p class="sub">This fills in automatically as members set goals.</p></div>';return '<div class="panel"><span class="section-eyebrow">Demand signals</span><h2>What members want</h2><p class="sub">Auto-fed from the goals members set. Of '+M.membersN+' members, the most-wanted are '+M.topGoals.slice(0,4).map(function(g){return _insEsc(g.label)+' ('+g.count+')';}).join(', ')+'.</p>'+imdBarList(M.topGoals,'var(--sage)','var(--sage)')+'</div>';}
function imdTransform(M){var delta=M.densNow-M.densBase;var squares=M.squares||[];var h='<div class="imd-hero"><div><div class="eyebrow">Measurable transformation</div><h2>Are people\'s lives improving?</h2><div class="imd-big"><span>'+(delta>=0?'▲ ':'▼ ')+Math.abs(delta)+'</span><em>points of green density</em></div><div class="imd-move">Green density <b>'+M.densBase+'% → '+M.densNow+'%</b> · baseline to current</div><p class="sub" style="color:#b9cbc9;margin-top:10px;max-width:44ch">Green density is the share of measured life indicators reported as stable or thriving.</p></div><div><div class="imd-field">'+(squares.length?squares.map(function(c){return '<span class="imd-sq" style="background:'+c+'"></span>';}).join(''):'<p class="sub" style="color:#b9cbc9">No check-ins yet.</p>')+'</div><div class="imd-key"><span><i style="background:#4F8A63"></i>Thriving</span><span><i style="background:#D8A23A"></i>Working on it</span><span><i style="background:#C8553D"></i>Needs support</span></div></div></div>';h+='<div class="ins-tiles" style="margin-top:16px"><div class="ins-tile"><div class="v">'+M.membersN+'</div><div class="l">Members</div></div><div class="ins-tile"><div class="v">'+M.baseDone+' / '+M.curDone+'</div><div class="l">Baseline / current check-ins</div></div><div class="ins-tile" data-imdtab="ach" style="cursor:pointer" title="View achievements"><div class="v">'+M.verified+'</div><div class="l">Achievements reached &rarr;</div></div></div>';if(M.satB!=null||M.satC!=null)h+='<div class="panel" style="margin-top:16px"><span class="section-eyebrow">Self-reported flourishing</span><h2>Life satisfaction</h2><p class="sub" style="margin:2px 0 8px">A 1–10 scale, based on the Harvard Human Flourishing Index.</p><div class="ins-tiles"><div class="ins-tile"><div class="v">'+(M.satB!=null?(+M.satB).toFixed(1):'—')+'</div><div class="l">Avg baseline</div></div><div class="ins-tile"><div class="v">'+(M.satC!=null?(+M.satC).toFixed(1):'—')+'</div><div class="l">Avg now</div></div><div class="ins-tile"><div class="v" style="color:'+((M.satC!=null&&M.satB!=null&&M.satC>=M.satB)?'var(--sage)':'var(--coral)')+'">'+((M.satC!=null&&M.satB!=null)?((M.satC-M.satB>=0?'+':'')+(M.satC-M.satB).toFixed(1)):'—')+'</div><div class="l">Change</div></div></div></div>';h+='<div class="panel" style="margin-top:16px"><span class="section-eyebrow">The seven Human Essentials</span><h2>Baseline to current</h2><div class="imd-legend"><span><i style="background:#B7C6C5"></i>Baseline (where they started)</span><span><i style="background:var(--sage)"></i>Improved since</span><span><i style="background:var(--coral)"></i>Declined</span></div>'+M.perE.map(function(dd){var lo=Math.min(dd.baseG,dd.curG),up=Math.max(dd.baseG,dd.curG),imp=dd.curG>=dd.baseG;return '<div class="imd-erow"><div class="imd-eh"><span>'+_insEsc(dd.name)+'</span><span class="num">'+dd.baseG+'% → '+dd.curG+'%</span></div><div class="imd-ebar"><span class="eb-base" style="width:'+lo+'%"></span><span class="eb-chg '+(imp?"up":"down")+'" style="left:'+lo+'%;width:'+(up-lo)+'%"></span></div></div>';}).join('')+'</div>';var need=M.perE.slice().sort(function(a,b){return b.curR-a.curR;});h+='<div class="panel" style="margin-top:16px"><span class="section-eyebrow">Where people need help</span><h2>Share currently reporting red</h2>'+need.map(function(dd){return '<div class="imd-need"><span class="nm">'+_insEsc(dd.name)+'</span><span class="bar"><span style="width:'+dd.curR+'%"></span></span><span class="pct">'+dd.curR+'%</span></div>';}).join('')+'</div>';h+=imdMovement(M);h+=imdBarriers(M);return h;}
function imdMovement(M){var mv=M.movement;if(!mv)return '';var cats=[['redYellow','Red → Yellow','Out of crisis, not yet stable','var(--gold)'],['yellowGreen','Yellow → Green','Reached stability','var(--sage)'],['redGreen','Red → Green','Crisis to stable in one step','var(--sage)'],['noChange','No change','Same status at both check-ins','#8ba0a0'],['declined','Declined / Regressed','Moved backward on at least one Essential','var(--coral)']];var tiles=cats.map(function(c){return '<div class="mv-tile" style="border-top-color:'+c[3]+'"><div class="mv-cap"><i style="background:'+c[3]+'"></i>'+c[1]+'</div><div class="mv-n">'+(mv[c[0]]||0)+'</div><div class="mv-d">'+c[2]+'</div></div>';}).join('');var imp=(mv.redYellow||0)+(mv.yellowGreen||0)+(mv.redGreen||0);var tot=imp+(mv.noChange||0)+(mv.declined||0);function pc(n){return tot?Math.round(n/tot*100):0;}var seg=[[mv.redYellow||0,'var(--gold)'],[(mv.yellowGreen||0)+(mv.redGreen||0),'var(--sage)'],[mv.noChange||0,'#c2cfce'],[mv.declined||0,'var(--coral)']];var bar=tot?('<div class="mv-bar">'+seg.map(function(s){if(!s[0])return '';var p=pc(s[0]);return '<span style="width:'+p+'%;background:'+s[1]+';color:'+(s[1]==='#c2cfce'?'var(--navy)':'#fff')+'">'+p+'%</span>';}).join('')+'</div>'):'';return '<div class="panel" style="margin-top:16px"><span class="section-eyebrow">Movement between assessments</span><h2>Are people moving forward?</h2><p class="sub">Change in status from each member’s first check-in to their latest, across the seven Human Essentials.</p><div class="mv-grid">'+tiles+'</div>'+bar+'<p class="sub" style="margin-top:10px">'+(mv.participants||0)+' members with two or more completed check-ins. Everyone else has a baseline and nothing to compare it to yet.</p></div>';}
function imdBarriers(M){var b=M.barriers;if(!b||!b.length)return '';return '<div class="panel" style="margin-top:16px"><span class="section-eyebrow">Top current barriers</span><h2>What’s holding people back</h2><p class="sub">Named obstacles, sized by how many members they affect right now.</p><div class="tbl-wrap"><table class="tbl" style="min-width:560px"><thead><tr><th>Barrier</th><th>People impacted</th><th>% of members</th><th>Human Essential</th></tr></thead><tbody>'+b.map(function(r){return '<tr><td class="nm">'+_insEsc(r.label)+(r.sub?'<div class="mv-d" style="margin-top:2px">'+_insEsc(r.sub)+'</div>':'')+'</td><td>'+(r.people!=null?r.people:'—')+'</td><td>'+(r.pct!=null?r.pct+'%':'—')+'</td><td>'+_insEsc(r.essential||'')+'</td></tr>';}).join('')+'</tbody></table></div></div>';}

function imdCrime(M){
  var CRIME_DATA = {asOf:'August 2026',citywide2025:50632,citywideChange:-3.4,hubChange:-10.8,refChange:+2.1,coverage:'Jan 2005 – 2026 · ~1.08M citywide records',areas:[['Hope 4 Da Hood','Community hub',-14.2],['Build & Rebuild','Community hub',-11.6],['Dellrose United Methodist','Community hub',-9.8],['Iasis Christian Center','Community hub',-7.4],['Reference area A','Neighborhood centroid',+1.7],['Reference area B','Neighborhood centroid',+2.6]]};
  var d=CRIME_DATA,max=16;
  var bars=d.areas.map(function(a){var name=a[0],kind=a[1],chg=a[2];var down=chg<0;var w=Math.min(Math.abs(chg)/max,1)*50;var style=down?'right:50%;width:'+w.toFixed(1)+'%;background:var(--sage);':'left:50%;width:'+w.toFixed(1)+'%;background:var(--coral);';return '<div class="imd-cr-bar"><div class="nm">'+_insEsc(name)+'<small>'+_insEsc(kind)+'</small></div><div class="imd-cr-track"><span class="imd-cr-zero" style="left:50%"></span><span class="imd-cr-fill" style="'+style+'"></span></div><div class="v '+(down?'down':'up')+'">'+(chg>0?'+':'')+chg.toFixed(1)+'%</div></div>';}).join('');
  return '<div class="imd-cr-real"><b>Real data</b><p>Unlike the other tabs on this dashboard, the figures here are actual measured records — not illustrative samples. They come from Kansas Open Records Act requests to the Wichita Police Department covering January 2005 forward.</p></div>'+
  '<div class="imd-cr-kpis"><div class="imd-cr-kpi"><div class="l">Reported incidents citywide, 2025</div><div class="n">'+d.citywide2025.toLocaleString()+'</div><div class="s">Down '+Math.abs(d.citywideChange)+'% against 2019. Every reported WPD incident, from the same records as the neighborhood datasets.</div></div><div class="imd-cr-kpi"><div class="l">Hub areas, change 2019–2025</div><div class="n down">'+d.hubChange+'%</div><div class="s">Half-mile radius around the four active community organizations.</div></div><div class="imd-cr-kpi"><div class="l">Reference areas, same window</div><div class="n up">+'+d.refChange+'%</div><div class="s">Two neighborhood centroids chosen for comparison. The ~13-point differential is the finding worth investigating.</div></div></div>'+
  '<div class="panel" style="margin-bottom:16px"><div class="eyebrow" style="color:var(--muted)">2019 to 2025 · by area</div><h3 style="font-family:var(--display);font-size:20px;margin:8px 0 4px">Change in reported incidents</h3><p class="sub" style="margin-bottom:14px">Green bars fell, coral bars rose. The four hub areas are half-mile radii around active community organizations; the two reference areas are neighborhood centroids.</p><div class="imd-cr-bars">'+bars+'</div></div>'+
  '<div class="ins-tiles" style="margin-bottom:16px"><div class="ins-tile"><div class="eyebrow" style="color:var(--muted)">Why it sits here</div><p class="sub" style="margin-top:8px">Safety is the condition underneath several Human Essentials rather than one of them. Where property crime is rising, "safe and affordable housing" means something different, transportation after dark costs more, and community connection is harder to reach. This measures the environment members live in; the other tabs measure the members.</p></div><div class="ins-tile"><div class="eyebrow" style="color:var(--coral)">Suggestive, not causal</div><p class="sub" style="margin-top:8px">Reference areas were picked as neighborhood centroids, not verified as places without community programming. They are a convenience comparison, not a control group. This is a pattern worth investigating — not evidence the hubs caused the decline. That caveat should travel with the number every time it is shown.</p></div><div class="ins-tile"><div class="eyebrow" style="color:var(--muted)">How it is refreshed</div><p class="sub" style="margin-top:8px">Each update is a fresh records request, entered by hand — there is no live feed. Figures current as of '+_insEsc(d.asOf)+'. If a WPD open-data endpoint becomes available, this becomes the only tab that could refresh itself.</p></div></div>'+
  '<div class="imd-cr-launch"><div class="imd-cr-lbody"><div class="eyebrow">Wichita Crime Data Project</div><h3>Explore the full neighborhood dashboard</h3><p>Six neighborhoods compared against citywide trends, filterable by distance, year and offense type. Four of the six centre on active community organizations — the same hubs that act as front doors into the Every Person Empowered framework.</p><a class="imd-cr-btn" href="https://wichita-crime-visualization.netlify.app/" target="_blank" rel="noopener">Open the crime dashboard <span aria-hidden="true">&#8599;</span></a><span class="imd-cr-lnote">Opens in a new tab · wichita-crime-visualization.netlify.app</span></div><div class="imd-cr-lside"><div class="imd-cr-lrow"><span class="k">Source</span><span class="v">WPD incident records via KORA</span></div><div class="imd-cr-lrow"><span class="k">Coverage</span><span class="v">'+_insEsc(d.coverage)+'</span></div><div class="imd-cr-lrow"><span class="k">Geography</span><span class="v">Six half-mile radii, plus citywide</span></div><div class="imd-cr-lrow"><span class="k">Figures as of</span><span class="v">'+_insEsc(d.asOf)+'</span></div></div></div>';
}
function imdInsights(M){var ins=M.insights||{};function bl(items,color){if(!items||!items.length)return '<p class="sub">No data yet.</p>';var mx=items[0].count||1;return items.map(function(g){return '<div class="imd-need"><span class="nm" style="width:210px">'+_insEsc(g.label)+'</span><span class="bar"><span style="width:'+Math.round(g.count/mx*100)+'%;background:'+color+'"></span></span><span class="pct" style="color:'+color+'">'+g.count+'</span></div>';}).join('');}var h='<div class="ins-tiles"><div class="ins-tile"><div class="v">'+(ins.membersN!=null?ins.membersN:(M.membersN||0))+'</div><div class="l">Members</div></div><div class="ins-tile"><div class="v">'+(ins.avgHousehold!=null?(+ins.avgHousehold).toFixed(1):'\u2014')+'</div><div class="l">Avg people in household</div></div><div class="ins-tile"><div class="v">'+(ins.avgUnder18!=null?(+ins.avgUnder18).toFixed(1):'\u2014')+'</div><div class="l">Avg children under 18</div></div><div class="ins-tile"><div class="v">'+(ins.avgAge!=null?Math.round(ins.avgAge):'—')+'</div><div class="l">Average age</div></div></div>';h+='<div class="panel" style="margin-top:16px"><span class="section-eyebrow">Transportation</span><h2>How are people getting around now?</h2><p class="sub">From members\u2019 answer to \u201cHow do you usually get around?\u201d</p>'+bl(ins.transport,'var(--sage)')+'</div>';h+='<div class="panel" style="margin-top:16px"><span class="section-eyebrow">Income</span><h2>Income range</h2><p class="sub">Self-reported income'+(ins.topIncome?' \u2014 most common: '+_insEsc(ins.topIncome):'')+'.</p>'+bl(ins.income,'var(--gold)')+'</div>';h+='<div class="panel" style="margin-top:16px"><span class="section-eyebrow">Employment</span><h2>Employment status</h2>'+bl(ins.employment,'var(--navy)')+'</div>';h+='<div class="panel" style="margin-top:16px"><span class="section-eyebrow">Demographics</span><h2>More coming</h2><p class="sub">Race, primary language, and other fields can be surfaced here as they\u2019re collected.</p></div>';return h;}
function imdAch(M){if(!M.achievements||!M.achievements.length)return '<div class="panel"><span class="section-eyebrow">Achievements</span><h2>Milestones reached</h2><p class="sub">Fills in as members mark achievements.</p></div>';var total=M.achievements.reduce(function(a,x){return a+x.count;},0);return '<div class="panel"><div class="imd-achhead"><div><span class="section-eyebrow">Achievements</span><h2>Milestones members have reached</h2><p class="sub">'+total+' achievements marked across '+M.membersN+' members.</p></div><div class="imd-bignum"><div class="imd-bignum-n">'+total+'</div><div class="imd-bignum-l">Achievements</div></div></div>'+imdBarList(M.achievements,'var(--gold)','#9a6b16')+'</div>';}
function imdSolutions(M){var h=(!M.solutions||!M.solutions.length)?'<div class="panel"><span class="section-eyebrow">Bank of Solutions</span><h2>Most-opened solutions</h2><p class="sub">Click tracking fills in as members open solution links.</p></div>':'<div class="panel"><span class="section-eyebrow">Bank of Solutions</span><h2>Most-opened solutions</h2><p class="sub">Which partner solutions members are clicking into.</p>'+imdBarList(M.solutions,'var(--navy)','var(--navy)')+'</div>';if(M.reviews&&M.reviews.length){h+='<div class="panel" style="margin-top:16px"><span class="section-eyebrow">Ratings & reviews</span><h2>How members rate organizations</h2><p class="sub">Average scores from member reviews.</p><div class="tbl-wrap"><table class="tbl" style="min-width:520px"><thead><tr><th>Solutions or Programs</th><th>Reviews</th><th>Recommend (NPS)</th><th>Life impact</th></tr></thead><tbody>'+M.reviews.map(function(r){return '<tr><td class="nm">'+_insEsc(r.org)+'</td><td>'+r.count+'</td><td>'+(r.avgNps!=null?(+r.avgNps).toFixed(1):'—')+' / 10</td><td>'+(r.avgTr!=null?(+r.avgTr).toFixed(1):'—')+' / 10</td></tr>';}).join('')+'</tbody></table></div></div>';}else{h+='<div class="panel" style="margin-top:16px"><span class="section-eyebrow">Ratings & reviews</span><h2>How members rate organizations</h2><p class="sub">Fills in as members leave reviews.</p></div>';}return h;}
function imdStories(M){if(!M.stories||!M.stories.length)return '<div class="panel"><span class="section-eyebrow">Stories</span><h2>Transformation stories</h2><p class="sub">Member stories will appear here.</p></div>';return '<div class="panel"><span class="section-eyebrow">Stories</span><h2>Transformation stories ('+M.stories.length+')</h2></div>'+M.stories.map(function(st){return '<div class="panel" style="margin-top:12px"><div class="story-q">'+(st.title?('<b>'+_insEsc(st.title)+'</b><br>'):'')+_insEsc(st.body||'')+'</div><p class="sub" style="margin-top:6px">— '+_insEsc(st.name||'Member')+'</p></div>';}).join('');}
function pubZipBar(){var d=window._pubData;if(!d||!d.zips||!d.zips.length)return '';var cur=window._pubZip||'';return '<div class="pub-zip"><label>Filter by ZIP <select onchange="pubSetZip(this.value)"><option value=""'+(cur?'':' selected')+'>All ZIPs</option>'+d.zips.map(function(z){return '<option value="'+z+'"'+(cur===z?' selected':'')+'>'+z+'</option>';}).join('')+'</select></label></div>';}
function pubSetZip(z){window._pubZip=z||'';pubApplyZip();}
function pubApplyZip(){var d=window._pubData;var M=(window._pubZip&&d&&d.byZip&&d.byZip[window._pubZip])?d.byZip[window._pubZip]:d;imdRender(M);}
function imdRender(M){var box=document.getElementById('imdBox');if(!box)return;window._imdM=M;var tab=window._imdTab||'demand';var body=(tab==='crime')?imdCrime(M):((tab==='insights')?imdInsights(M):((tab==='transform')?imdTransform(M):((tab==='ach')?imdAch(M):((tab==='solutions')?imdSolutions(M):((tab==='stories')?imdStories(M):imdDemand(M))))));box.innerHTML=pubZipBar()+imdTabsNav()+body;}

document.addEventListener('click',function(e){var t=e.target.closest('[data-imdtab]');if(t){window._imdTab=t.getAttribute('data-imdtab');if(window._imdM)imdRender(window._imdM);}});

function fmtWhen(iso){if(!iso)return '';try{var d=new Date(iso);return d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});}catch(x){return '';}}

function boot(){
  var note=document.getElementById('pubNote');
  if(!sb){window._pubData=imdSample();pubApplyZip();if(note)note.textContent='Showing sample data (offline preview).';return;}
  sb.from('impact_snapshot').select('data,published_at').eq('id',1).maybeSingle().then(function(r){
    if(r&&!r.error&&r.data&&r.data.data&&r.data.data.perE){
      window._pubData=r.data.data;pubApplyZip();
      if(note)note.textContent='Last updated '+fmtWhen(r.data.published_at)+'.';
    }else{
      window._pubData=imdSample();pubApplyZip();
      if(note)note.textContent='Showing sample data until the dashboard is published.';
    }
  },function(){imdRender(imdSample());if(note)note.textContent='Showing sample data.';});
}
if(sb){boot();}else{window.addEventListener('load',boot);}
</script>
</body>
</html>
